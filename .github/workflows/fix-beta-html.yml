name: Beta checks
on:
  push:
    branches: [main]
    paths:
      - '**.html'
      - '**.js'
      - '**.cjs'
      - '.github/workflows/fix-beta-html.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check app, beta lessons and offline dependencies
        shell: bash
        run: |
          set -e
          for test in tests/*.cjs; do
            node "$test"
          done
