name: Beta checks
on:
  push:
    branches: [main]
    paths:
      - '**.html'
      - '**.js'
      - '**.cjs'
      - '.github/workflows/fix-beta-html.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fetch previous beta releases for upgrade checks
        shell: bash
        run: git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main pull/13/head:refs/heads/pr/13 pull/14/head:refs/heads/pr/14 dfae2cfe7ae3f0b66946829285f1a907481f1268
      - name: Install browser test dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/leren-test-deps" --no-audit --no-fund --package-lock=false playwright@1.64.1
          echo "NODE_PATH=$RUNNER_TEMP/leren-test-deps/node_modules" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/leren-test-deps/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check app, beta lessons and offline dependencies
        shell: bash
        run: |
          set -e
          for test in tests/*.cjs; do
            node "$test"
          done
      - name: Check TEST-030 design lab
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8279 --bind 127.0.0.1 > "$RUNNER_TEMP/test030-http.log" 2>&1 &
          test030_server=$!
          trap 'kill "$test030_server"' EXIT
          curl --fail --silent --retry 5 --retry-connrefused --retry-delay 1 http://127.0.0.1:8279/design-lab/test-030/ > /dev/null
          node design-lab/test-030/checks/audit.cjs
          node design-lab/test-030/checks/interactions.cjs
          node design-lab/test-030/checks/gallery.cjs
          LEXI_LAB_URL=http://127.0.0.1:8279/design-lab/test-030/lexi/ node design-lab/test-030/checks/lexi-contract.cjs
