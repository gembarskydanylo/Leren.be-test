function recordPathResult(id,correct,total){

 if(!lesson||total!==lesson.ids.length||!Number.isInteger(correct)||correct<0||correct>total)return 0;
 let best=lsGet("leren_path_rewards_v1",{});if(!best||typeof best!=="object"||Array.isArray(best))best={};
 const old=best[id],previous=Math.max(Number.isInteger(old)&&old>=0&&old<=total?old:0,pathSessionRewards[id]||0);
 const gain=Math.max(0,correct-previous)*5;if(!gain){rewardCheck(true);queueProgressSync();return 0}
 pathSessionRewards[id]=correct;best[id]=correct;lsSet("leren_path_rewards_v1",best);addXP(gain);saveStore();rewardCheck(true);queueProgressSync();updateStats();return gain;
}

let tourIdx=-1,tourRoot=null,tourTimer=0;
function tourT(){return TOUR_UI[uiLang]||TOUR_UI.uk}
function tourRect(step){
 if(!step.at)return null;
 const rs=step.at.map(s=>document.querySelector(s)).filter(e=>e&&e.offsetParent!==null||e&&getComputedStyle(e).position==="fixed").map(e=>e.getBoundingClientRect()).filter(r=>r.width||r.height);
 if(!rs.length)return null;
 const pad=6,vw=innerWidth,vh=innerHeight;
 let l=Math.min(...rs.map(r=>r.left))-pad,t=Math.min(...rs.map(r=>r.top))-pad,r=Math.max(...rs.map(r=>r.right))+pad,b=Math.max(...rs.map(r=>r.bottom))+pad;
 l=Math.max(4,l);t=Math.max(4,t);r=Math.min(vw-4,r);b=Math.min(vh-4,b);
 return {left:l,top:t,width:Math.max(0,r-l),height:Math.max(0,b-t),right:r,bottom:b};
}
function tourPlace(){
 if(!tourRoot)return;
 const step=TOUR_STEPS[tourIdx],spot=tourRoot.querySelector(".tour-spot"),card=tourRoot.querySelector(".tour-card");
 const r=tourRect(step),vw=innerWidth,vh=innerHeight,gap=12;
 const w=Math.min(420,vw-24);card.style.width=w+"px";
 const h=card.offsetHeight;
 if(!r){spot.style.cssText="left:50%;top:50%;width:0;height:0";card.style.left=Math.round((vw-w)/2)+"px";card.style.top=Math.max(12,Math.round((vh-h)/2))+"px";return}
 spot.style.cssText=`left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px`;
 let left=Math.min(Math.max(12,r.left+r.width/2-w/2),vw-w-12),top;
 if(vh-r.bottom>=h+gap+8)top=r.bottom+gap;
 else if(r.top>=h+gap+8)top=r.top-h-gap;
 else top=r.top+r.height/2<vh/2?vh-h-12:12;
 card.style.left=Math.round(left)+"px";card.style.top=Math.round(Math.max(12,top))+"px";
}
function tourShow(i){
 tourIdx=Math.max(0,Math.min(TOUR_STEPS.length-1,i));
 const step=TOUR_STEPS[tourIdx],tx=step[uiLang]||step.uk,u=tourT(),last=tourIdx===TOUR_STEPS.length-1;
 const card=tourRoot.querySelector(".tour-card");card.replaceChildren();
 card.appendChild(el("div","tour-count",(tourIdx+1)+" / "+TOUR_STEPS.length));
 const h=el("h2","",tx[0]);h.id="tourTitle";card.appendChild(h);
 tx.slice(1).forEach(p=>{const e=el("p","");e.innerHTML=p;card.appendChild(e)});
 if(step.actions){const a=el("div","tour-actions");step.actions.forEach(k=>{
  const b=el("button","btn");b.type="button";
  if(k==="pickVoice"){b.textContent=u.pickVoice;b.onclick=()=>{updateHeader();populateVoicePicker();$("voiceDialog").showModal()}}
  else if(k==="sample"){b.textContent=u.sample;b.onclick=()=>say(speechSampleText(),b)}
  else if(k==="auto"){const lab=()=>b.textContent=autoSpeech?u.autoOff:u.autoOn;lab();b.onclick=()=>{autoSpeech=!autoSpeech;lsSet("leren_auto_speech",autoSpeech);updateHeader();lab()}}
  a.appendChild(b)});card.appendChild(a)}
 const dots=el("div","tour-dots");TOUR_STEPS.forEach((_,j)=>dots.appendChild(el("i",j===tourIdx?"on":"")));card.appendChild(dots);
 const row=el("div","tour-row");
 const skip=el("button","tour-skip",u.skip);skip.type="button";skip.onclick=()=>tourEnd();if(last)skip.style.visibility="hidden";
 const back=el("button","btn",u.back);back.type="button";back.disabled=tourIdx===0;back.onclick=()=>tourShow(tourIdx-1);
 const next=el("button","btn primary",last?u.start:u.next);next.type="button";next.onclick=()=>last?tourEnd():tourShow(tourIdx+1);
 row.append(skip,back,next);card.appendChild(row);
 // bring the target into view, then place spotlight and card
 const t=step.at&&document.querySelector(step.at[0]);
 if(t&&getComputedStyle(t).position!=="fixed"&&getComputedStyle(t).position!=="absolute"){const b=t.getBoundingClientRect();if(b.top<70||b.bottom>innerHeight-200)t.scrollIntoView({block:"center",behavior:"smooth"})}
 if(t&&t.id==="themeToggle"||t&&t.id==="helpBtn"||t&&t.closest&&t.closest("header"))window.scrollTo({top:0,behavior:"smooth"});
 tourPlace();clearTimeout(tourTimer);tourTimer=setTimeout(tourPlace,420);
 next.focus({preventScroll:true});
}
function tourKey(e){
 if(!tourRoot||$("voiceDialog")?.open)return;
 if(e.key==="Escape"){e.preventDefault();tourEnd()}
 else if(e.key==="ArrowRight"&&!e.target.closest?.("select"))tourShow(tourIdx+(document.documentElement.dir==="rtl"?-1:1));
 else if(e.key==="ArrowLeft"&&!e.target.closest?.("select"))tourShow(tourIdx+(document.documentElement.dir==="rtl"?1:-1));
}
function startTour(){
 if(tourRoot)return;
 document.querySelectorAll(".sheet:not([hidden])").forEach(x=>closeSheet(x.id));
 if(view!=="lesson")setView("lesson");
 tourRoot=el("div","tour");tourRoot.setAttribute("role","dialog");tourRoot.setAttribute("aria-modal","true");tourRoot.setAttribute("aria-labelledby","tourTitle");
 tourRoot.append(el("div","tour-spot"),el("div","tour-card"));
 document.body.appendChild(tourRoot);
 addEventListener("resize",tourPlace);addEventListener("scroll",tourPlace,{passive:true});document.addEventListener("keydown",tourKey);
 tourShow(0);
}
function tourEnd(){
 if(!tourRoot)return;
 lsSet("leren_tour_done",true);
 removeEventListener("resize",tourPlace);removeEventListener("scroll",tourPlace);document.removeEventListener("keydown",tourKey);
 tourRoot.remove();tourRoot=null;tourIdx=-1;clearTimeout(tourTimer);
 if(typeof afterTourEnd==="function")afterTourEnd();
 $("helpBtn")?.focus({preventScroll:true});
}
$("helpBtn").addEventListener("click",()=>{closeSheet("settingsSheet");setTimeout(startTour,250)});
function updateHelpBtn(){}
if(targetLang!=="nl")setTimeout(firstRun,600);
</script>
