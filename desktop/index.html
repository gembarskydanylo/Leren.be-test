let toetsId = null, toetsQ = 0, toetsRight = 0, toetsLocked = false;

function startToets(){
  document.querySelectorAll("#catNav button, #subNav button").forEach(b=>b.setAttribute("aria-selected","false"));
  $("prog").textContent="";$("rnd").textContent=levelById(curLevel).name;
  $("barfill").style.width="0%";$("barfill").parentElement.setAttribute("aria-valuenow","0");
  LerenTestLibrary.render({card:$("card"),el,tests:TOETS,level:curLevel,lang:uiLang,best:lsGet("poly_toetsbest",{}),
    topicInfo:(id,lang)=>LerenCurriculum.topicInfo(id,lang),unlocked:levelUnlocked,
    exam:curLevel==="a11"&&window.EXAM11?()=>EXAM11.open():null,
    changeLevel:id=>{if(!levelUnlocked(id)){$("card").classList.remove("test-library");showLevelLocked(levelById(id));return}curLevel=id;const c=levelCats()[0];currentCat=c.id;tab=c.tabs.find(tabVisible)||"all";saveStore();buildNav();startToets()},
    open:t=>{toetsId=t.id;toetsQ=0;toetsRight=0;toetsLocked=false;if(t.id==="diphthongs")diphTheory();else nextToetsQuestion()}
  });
}

function nextToetsQuestion(){
  $("card").classList.remove("test-library");$("card").removeAttribute("dir");
  cardToTop();
  const test = TOETS.find(t => t.id === toetsId);
  if(!test){ startToets(); return; }
  if(toetsQ >= test.questions.length){ endToets(); return; }
  toetsLocked = false;
  const item = test.questions[toetsQ];
  const u = getUI();
  $("prog").textContent = (u.toetsQ||"Питання") + " " + (toetsQ+1) + " " + (u.toetsOf||"з") + " " + test.questions.length;
  $("rnd").textContent = (test.title[uiLang] || test.title.en);
  const pct = Math.round(toetsQ / test.questions.length * 100);
  $("barfill").style.width = pct + "%";
  $("barfill").parentElement.setAttribute("aria-valuenow", String(pct));

  const card = $("card");
  card.replaceChildren();
  const top = el("div","q");
  top.appendChild(questionPicture(item,{test:true,title:Object.values(test.title||{}).join(" ")}));

  if(item.type === "read" && item.text){
    const txt = el("p","toets-text", item.text); tgt(txt);
    top.appendChild(txt);
  }

  const qText = item.q[uiLang] || item.q.en || item.q.uk || "";
  top.appendChild(el("small","", qText));

  if(item.type === "gap" && item.sentence){
    const sent = el("h2","", item.sentence.replace("___","______"));
    sent.style.marginTop = "8px";
    top.appendChild(tgt(sent));
  }

  if(item.type === "diph"){
    const audio=el("button","btn","🔊 "+diphU()[5]);audio.type="button";
    audio.onclick=()=>sayIn(item.word,"nl");top.appendChild(audio);
  }
  card.appendChild(top);

  const opts = el("div","opts");
  card.appendChild(opts);
  const fb = el("div","feedback");
  fb.id = "feedback";
  fb.setAttribute("role","status");
  card.appendChild(fb);
  const row = el("div","row");
  const nx = el("button","btn primary", u.toetsNext || u.next || "Далі");
  nx.type = "button";
  nx.disabled = true;
  nx.id = "nx";
  nx.onclick = () => { toetsQ++; nextToetsQuestion(); };
  row.appendChild(nx);
  card.appendChild(row);

  const optLabel = (opt) => {
    if (opt && typeof opt === "object") return opt[uiLang] || opt.en || opt.uk || Object.values(opt)[0] || "";
    return String(opt ?? "");
  };
  shuffle((item.opts || []).map((opt, i) => ({opt, i}))).forEach(({opt, i}) => {
    const b = el("button","opt");
    b.type = "button";
    b.dataset.ok = (i === item.ok) ? "1" : "";
    const label = optLabel(opt);
    const t = el("span","", label);
    if(item.type === "gap") tgt(t); // Dutch gap words only
    b.appendChild(t);
    b.onclick = () => answerToets(i === item.ok, b, item);
    opts.appendChild(b);
  });
  if(globalThis.LerenEmoji)globalThis.LerenEmoji.enhance(card);
}

// the Dutch phrase quoted in the question, or the Dutch answer itself.
function toetsSpoken(item){
  if(!item || !item.opts) return "";
  const ans = item.opts[item.ok];
  if(item.type === "gap" && item.sentence && typeof ans === "string") return item.sentence.replace("___", ans);
  const qen = (item.q && (item.q.en || item.q.uk)) || "";
  if(ans && typeof ans === "object"){ const m = qen.match(/«([^»]+)»/); return m ? m[1] : ""; }
  const a = String(ans ?? "").trim(); if(!a || a === "—" || /^[\d:.,\s]+$/.test(a)) return "";
  if(qen.includes("___")){ const part = qen.slice(qen.lastIndexOf(":") + 1).trim(); return part.replace("___", a); }
  return a;
}
function answerToets(ok, btn, item){
  if(toetsLocked) return;
  toetsLocked = true;
  const u = getUI();
  if(ok) toetsRight++;
  document.querySelectorAll(".opt").forEach(b => {
    b.disabled = true;
    if(b.dataset.ok === "1") b.classList.add("correct");
  });
  if(!ok) btn.classList.add("incorrect");
  const fb = $("feedback");
  fb.replaceChildren();
  fb.appendChild(el("strong","", ok ? (u.correct||"Правильно!") : (u.incorrect||"Неправильно.")));
  if(!ok && item.opts){
    const ans = item.opts[item.ok];
    const label = (ans && typeof ans === "object") ? (ans[uiLang]||ans.en||ans.uk||"") : String(ans??"");
    fb.appendChild(el("p","example", label));
  }
  if(item.explanation) fb.appendChild(el("p","example",item.explanation[uiLang]||item.explanation.en));
  fb.setAttribute("role","status");
  const nx = $("nx");
  if(nx) nx.disabled = false;
  revealNext();
  const sp = toetsSpoken(item); if(sp && item.type!=="diph") autoSay(sp);
}

function endToets(){
  const test = TOETS.find(t => t.id === toetsId);
  const total = test ? test.questions.length : 0;
  const pct = total ? Math.round(toetsRight / total * 100) : 0;
  const u = getUI();
  $("barfill").style.width = "100%";
  $("barfill").parentElement.setAttribute("aria-valuenow", "100");
  const card = $("card");
  card.replaceChildren();
  const end = el("div","end");
  const pg = pgU(), passMark = (test && test.pass) || 70, passed = pct >= passMark;
  const bestMap = lsGet("poly_toetsbest",{}), prev = test ? (bestMap[test.id]||0) : 0;
  const gain = Math.max(0, toetsRight - prev) * 10;
  if(test && toetsRight > prev){ bestMap[test.id] = toetsRight; lsSet("poly_toetsbest", bestMap); }
  let unlockedNow = null;
  if(test && test.kind === "leveltest" && passed){
    const un = lsGet("poly_unlocked",[]); if(!un.includes(test.unlocks)){ un.push(test.unlocks); lsSet("poly_unlocked", un); }
    unlockedNow = levelById(test.unlocks);
  }
  addXP(gain); saveStore(); updateStats();
  if(unlockedNow) toast(pg.passedLT(unlockedNow.name), true);
  end.appendChild(el("h2","", toetsRight + " / " + total));
  end.appendChild(el("p","", pct + "% · " + (passed ? (u.toetsPassed||"Склав!") : (u.toetsFailed||"Ще практика"))));
  end.appendChild(el("p","xp-note", unlockedNow ? pg.passedLT(unlockedNow.name) : (test && test.kind==="leveltest" && !passed) ? pg.ltNeed(passMark) : gain > 0 ? pg.newBest(gain) : pg.bestOnly(prev + "/" + total)));
  const grid = el("div","summary-grid");
  [[u.right||"Правильні", toetsRight],[u.points||"Балів", "+"+gain],[u.toetsScore||"Результат", pct+"%"]].forEach(([l,v])=>{
    const d = el("div"); d.append(el("strong","",v), el("span","",l)); grid.appendChild(d);
  });
  end.appendChild(grid);
  if(test){const tt=test.title[uiLang]||test.title.en||test.id;const sh=el("button","btn share-btn");sh.type="button";sh.append(ico("share"),el("span","",growU().share));sh.onclick=()=>shareResult(tt,pct,passed);end.appendChild(sh)}
  if(passed)maybeAskRating();
  const row = el("div","row");
  const again = el("button","btn", u.toetsAgain || "Ще раз");
  again.type = "button";
  again.onclick = () => { toetsQ=0; toetsRight=0; if(test && test.id==="diphthongs") test.questions=diphQuestions(); nextToetsQuestion(); };
  row.appendChild(again);
  const back = el("button","btn primary", unlockedNow ? "→ " + unlockedNow.name : (u.toetsBack || "До тестів"));
  back.type = "button";
  back.onclick = unlockedNow ? () => { curLevel = unlockedNow.id; const c = levelCats()[0]; currentCat = c.id; tab = c.tabs.find(tabVisible)||"all"; mode = "quiz"; saveStore(); updateModeButtons(); buildNav(); newRound(); } : startToets;
  row.appendChild(back);
  end.appendChild(row);
  card.appendChild(end);
}

function nextBuild(){
 locked=false;const s=deck.pop();q++;sessionIds.push("b"+q);
 // Richer decoys for higher levels: fixed + random words from other sentences
 const fixedDecoys=buildLevel===1?[]:["misschien","graag","altijd","vandaag"];
 let extraPool=[];
 if(buildLevel>=2){
  SENT.filter(x=>x.cat===currentCat&&x!==s).forEach(x=>x.q.forEach(w=>{if(!s.q.includes(w)&&!fixedDecoys.includes(w))extraPool.push(w)}));
  extraPool=shuffle([...new Set(extraPool)]).slice(0,2);
 }
 const decoys=fixedDecoys.concat(extraPool);
 const extras=(s.x?[s.x]:[]).concat(decoys).filter((w,i,a)=>!s.q.includes(w)&&a.indexOf(w)===i);
 const tiles=shuffle(s.q.map(w=>({w})).concat(extras.map(w=>({w}))));
 bs={s,tiles,slots:s.q.map(()=>null),stars:3,lock:false,done:false,bad:[]};
 renderBuild();if(bAudio)say(sentence(s));
}
function placeTile(t){
 if(bs.done||bs.lock)return;
 const k=bs.slots.indexOf(null);if(k<0)return;
 bs.slots[k]=t;afterPlace();
}
function clearSlot(k){if(bs.done||bs.lock||!bs.slots[k])return;bs.slots[k]=null;bs.bad=[];renderBuild()}
function afterPlace(){if(bs.slots.every(Boolean))checkBuild();else renderBuild()}
function checkBuild(){
 const cur=bs,bad=cur.s.q.map((w,k)=>cur.slots[k].w===w?-1:k).filter(k=>k>=0);
 if(!bad.length){finishBuild();return}
 cur.stars=Math.max(1,cur.stars-1);cur.bad=bad;cur.lock=true;renderBuild();
 setTimeout(()=>{if(bs!==cur||cur.done)return;bad.forEach(k=>{cur.slots[k]=null});cur.bad=[];cur.lock=false;renderBuild()},850);
}
function hintBuild(){
 if(bs.done||bs.lock)return;
 const {s,slots,tiles}=bs,k=s.q.findIndex((w,i)=>!slots[i]||slots[i].w!==w);if(k<0)return;
 const t=tiles.find(x=>x.w===s.q[k]),j=slots.indexOf(t);if(j>=0)slots[j]=null;
 slots[k]=t;bs.stars=Math.max(1,bs.stars-1);bs.bad=[];afterPlace();
}
function finishBuild(){
 const cur=bs,s=cur.s;cur.done=true;locked=true;
 if(!s.again){
  const pts=cur.stars===3?10:cur.stars===2?7:4;addXP(pts);roundPoints+=pts;
  if(cur.stars===3)right++;else{s.again=true;deck.unshift(s);roundTotal++}
  saveStore();updateStats();
 }
 renderBuild();
 say(sentence(s));
 revealNext(); // scrolls "Next" above the bottom dock, like the other modes
}
function renderBuild(){
 const u=getUI(),s=bs.s;
 $("prog").textContent=u.lessonProgress+" "+q+" / "+roundTotal;$("rnd").textContent=u.round+" "+round+" · "+u.build;updateProgress();
 const card=$("card");card.replaceChildren();
 const levelBar=el("div","row build-levels");levelBar.style.justifyContent="center";levelBar.style.marginBottom="10px";levelBar.setAttribute("aria-label",u.buildLevel);[1,2].forEach(lv=>{const lb=el("button","btn"+(buildLevel===lv?" primary":""),u.buildLevel+" "+lv);lb.type="button";lb.setAttribute("aria-pressed",String(buildLevel===lv));lb.onclick=()=>{if(buildLevel!==lv){buildLevel=lv;newRound()}};levelBar.appendChild(lb)});card.replaceChildren(levelBar);
 const top=el("div","q");top.appendChild(el("small","",u.buildSub));
 top.appendChild(questionPicture(s));
 if(bAudio&&!bs.done)top.appendChild(el("h2","sm","🔊"));else top.appendChild(el("h2","sm",s[uiLang]||s.en));
 const tools=el("div","row");tools.style.justifyContent="center";
 const hear=el("button","listen",u.repeat||u.listen);hear.type="button";hear.onclick=()=>say(sentence(s));
 const ear=el("button","listen",(bAudio?"✓ ":"")+u.byEar);ear.type="button";
 ear.onclick=()=>{bAudio=!bAudio;renderBuild();if(bAudio&&!bs.done)say(sentence(s))};
 tools.append(hear,ear);top.appendChild(tools);card.appendChild(top);
 const slots=el("div","slots");
 s.roles.split("").forEach((r,k)=>{
  const w=el("div","sw2 r"+r);w.appendChild(el("span","role",u.roles[r]));
  const t=bs.slots[k],b=el("button","slot"+(t?" filled":"")+(bs.bad.includes(k)?" bad":"")+(bs.done?" good":""),t?t.w:"");
  b.type="button";if(t)tgt(b);else b.setAttribute("aria-label",u.roles[r]||"");b.onclick=()=>clearSlot(k);w.appendChild(b);slots.appendChild(w);
 });
 card.appendChild(slots);
 const bank=el("div","bank");
 if(!bs.done)bs.tiles.filter(t=>!bs.slots.includes(t)).forEach(t=>{const b=el("button","opt tile",t.w);tgt(b);b.type="button";b.onclick=()=>placeTile(t);bank.appendChild(b)});
 card.appendChild(bank);
 const fb=el("div","feedback");fb.id="feedback";
 if(bs.done){fb.appendChild(el("strong","","⭐".repeat(bs.stars)+" "+u.correct));fb.appendChild(tgt(el("p","example",sentence(s))));fb.appendChild(el("p","",s[uiLang]||s.en))}
 card.appendChild(fb);
 const row=el("div","row");
 if(bs.done){const nx=el("button","btn primary",u.next);nx.type="button";nx.id="nx";nx.onclick=nextQuestion;row.appendChild(nx)}
 else{const h=el("button","btn",u.hint);h.type="button";h.disabled=bs.lock;h.onclick=hintBuild;row.appendChild(h)}
 card.appendChild(row);if(globalThis.LerenEmoji)globalThis.LerenEmoji.enhance(card);
}

 const id=await sha256Hex(sub.endpoint),fields=pushFields(sub,st),sig=JSON.stringify(fields);
 if(st.sig===sig&&st.id===id)return true;
 const {uid,t}=await pushToken();fields.uid={stringValue:uid};
 // updateMask: change only the app's own fields; lastSent belongs to the reminder server
 const r=await fetch(docUrl(id)+PUSH_FIELDS.map(f=>"&updateMask.fieldPaths="+f).join(""),{method:"PATCH",headers:{"Content-Type":"application/json",Authorization:"Bearer "+t},body:JSON.stringify({fields})});
 if(!r.ok){let m="";try{m=(await r.json()).error.message}catch(e){}throw new Error("Firestore "+r.status+(m?": "+m:""))}
 st.id=id;st.sig=sig;lsSet("leren_push",st);return true;
}
async function pushSubscribe(create=false){
 const reg=await navigator.serviceWorker.ready;
 const sub=await reg.pushManager.getSubscription();
 if(sub||!create)return sub;
 return reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64uToBytes(PUSH_CONFIG.vapid)});
}
// One permission prompt: subscribing asks for it. (Asking first with Notification.requestPermission() made the
// Android app ask twice, because there the page keeps seeing "default" after the app granted it.)
// Firebase loads in parallel from the tap, so the server step doesn't wait for it afterwards.
async function pushEnable(){
 const u=pushU(),st=pushState();pushToken().catch(()=>{});
 let sub;
 try{sub=await pushSubscribe(true)}
 catch(e){ // a browser that doesn't ask on subscribe: ask once, then subscribe again
  if(Notification.permission==="default"&&!(e&&e.name==="NotAllowedError")){
   const perm=await Notification.requestPermission();if(perm==="granted")try{sub=await pushSubscribe(true)}catch(e2){}}
  if(!sub){toast(Notification.permission==="denied"||e&&e.name==="NotAllowedError"?u.denied:u.fail);return false}}
 try{st.on=true;await pushWrite(sub,st);lsSet("leren_push",st);toast(u.ok);return true}
 catch(e){st.on=false;lsSet("leren_push",st);toast(u.fail+" ("+String(e&&e.message||e).slice(0,140)+")");return false}
}
// Turning reminders off: stop the browser subscription and delete the server copy. If the server can't be reached,
// the ID is kept in "pendingDel" and deleting is retried at the next start, so a copy is never left behind silently.
async function pushDeleteDoc(id){
 try{const {t}=await pushToken();const r=await fetch(docUrl(id),{method:"DELETE",headers:{Authorization:"Bearer "+t}});return r.ok||r.status===404}catch(e){return false}
}
async function pushDisable(){
 const st=pushState();st.on=false;
 try{const reg=await navigator.serviceWorker.ready,sub=await reg.pushManager.getSubscription();if(sub)await sub.unsubscribe()}catch(e){}
 const ids=[...new Set([...(st.pendingDel||[]),st.id].filter(Boolean))],left=[];
 for(const id of ids)if(!(await pushDeleteDoc(id)))left.push(id);
 delete st.id;delete st.sig;if(left.length)st.pendingDel=left;else delete st.pendingDel;lsSet("leren_push",st);
}
async function pushRetryDeletes(){const st=pushState();if(!(st.pendingDel||[]).length)return;
 const left=[];for(const id of st.pendingDel)if(!(await pushDeleteDoc(id)))left.push(id);
 const now=pushState();if(left.length)now.pendingDel=left;else delete now.pendingDel;lsSet("leren_push",now);}
let pushTimer=0;
// In the Android app (TWA) notification permission belongs to the app, and the page may keep reporting "default"
// after it was granted — so only an explicit "denied" counts as off.
const pushAllowed=()=>Notification.permission!=="denied";
function pushSync(){ // keeps streak / last activity / language / time up to date on the server
 if(pushReady()&&(pushState().pendingDel||[]).length)pushRetryDeletes().catch(()=>{});
 if(!pushReady()||!pushState().on||!pushAllowed())return;
 clearTimeout(pushTimer);pushTimer=setTimeout(async()=>{try{
  const st=pushState();if(!st.on||!pushAllowed())return;
  // Background sync must never create a subscription: subscribe() can prompt again.
  const sub=await pushSubscribe();if(sub&&pushState().on)await pushWrite(sub,st);
 }catch(e){}},1500);
}
function renderPushRow(busy){
 const row=$("remindRow");if(!row)return;row.hidden=!pushReady();if(row.hidden)return;
 const u=pushU(),st=pushState(),on=busy?busy==="on":!!st.on&&pushAllowed(),hint=$("remindHint"),sel=$("remindHour");
 $("remindLabel").textContent=u.label;
 const t=$("remindToggle");t.setAttribute("aria-checked",String(on));t.classList.toggle("busy",!!busy);
 sel.setAttribute("aria-label",u.time);
 if(!sel.options.length)for(let h=7;h<=22;h++){const o=document.createElement("option");o.value=h;o.textContent=hh(h);sel.appendChild(o)}
 sel.value=String(st.hour);
 // the time is part of the sentence: "every day at [18:00 ▾] if today's goal isn't done yet"
 if(busy){hint.replaceChildren(busy==="on"?u.wait:u.waitOff);sel.hidden=true;row.appendChild(sel);return}
 if(on){const [a,b]=u.on("\u0001").split("\u0001");sel.hidden=false;hint.replaceChildren(a,sel,b)}
 else{sel.hidden=true;row.insertBefore(sel,t);hint.replaceChildren(u.off)}
}
$("remindToggle").addEventListener("click",async()=>{
 const t=$("remindToggle");if(t.dataset.busy)return;t.dataset.busy="1";const off=t.getAttribute("aria-checked")==="true";
 renderPushRow(off?"off":"on"); // the switch moves at once; the work happens after
 try{if(off)await pushDisable();else await pushEnable()}finally{delete t.dataset.busy;renderPushRow()}
});

    const heF=qd.he||qd.v+"t",wrongT=!qd.v.endsWith("t")&&t.includes(heF),wrongInf=t.includes(qd.inf)&&vi<0;
    if(wrongT)ch.push([g.chkForm(heF,qd.v),false]);else if(wrongInf)ch.push([g.chkInf(qd.inf,qd.v),false]);
    else ch.push([g.chkVerb(qd.v),vi>=0&&ik>=0&&Math.abs(vi-ik)===1]);
    if(qd.p)ch.push([g.chkPart(qd.p),t[t.length-1]===qd.p]);

  const score=ch.filter(c=>c[1]).length/ch.length;if(!best||score>best.score)best={score,ch,text:a}});

// --- word pool for blitz / memory / dictation ---
function gPool(){
 const tabs=levelCats().flatMap(c=>c.tabs).filter(k=>!["klanken","vervoegen","separable"].includes(k)&&tabVisible(k));
 const seen=new Set();return tabs.flatMap(k=>{try{return itemsFor(k)}catch(e){return []}}).filter(x=>x&&x.id&&!seen.has(x.id)&&seen.add(x.id)&&labelFor(x)&&meaningFor(x));
}

// --- 4. blitz 60 s ---
function blStart(){
 const pool=gPool();gState={pool,score:0,left:60,cur:null,end:false};blNext();
 gTimer=setInterval(()=>{const s=gState;if(!s||s.end)return;s.left--;const t=$("gTime");if(t)t.textContent=s.left+"s";gBar(s.left/60);if(s.left<=0)blEnd()},1000);
}
function blNext(){
 const s=gState,g=gU();s.cur=s.pool[Math.floor(Math.random()*s.pool.length)];
 const right=meaningFor(s.cur),wrong=shuffle(s.pool.filter(x=>meaningFor(x)!==right)).slice(0,3).map(meaningFor);
 const card=gHead(g.bl,"",true);$("rnd").textContent=g.score+": "+s.score;gBar(s.left/60);
 const top=el("div","g-blitz");top.append(el("span","g-time",""),el("strong","g-score","⭐ "+s.score));top.firstChild.id="gTime";top.firstChild.textContent=s.left+"s";card.appendChild(top);
 const w=el("h2","g-word",shown(s.cur));tgt(w);card.appendChild(w);
 const opts=el("div","opts");shuffle([right,...wrong]).forEach(t=>{const b=el("button","opt",t);b.type="button";b.onclick=()=>{if(s.end)return;if(t===right){s.score++;blNext()}else{b.classList.add("incorrect");b.disabled=true;s.left=Math.max(0,s.left-2)}};opts.appendChild(b)});card.appendChild(opts);
}
function blEnd(){
 const s=gState,g=gU();s.end=true;clearInterval(gTimer);gTimer=0;
 const rec=gSetRecord("bl",s.score);const xp=s.score*2;
 const card=gHead(g.bl,g.time);gBar(1);
 card.append(el("p","g-big","⭐ "+s.score),el("p","g-done",(rec?"🏅 "+g.best+"! ":"")+g.pts(xp)));
 const row=el("div","row");const nx=el("button","btn primary",g.again);nx.type="button";nx.id="nx";nx.onclick=blStart;row.appendChild(nx);card.appendChild(row);
 gameDone("bl",xp);
}

// --- 5. memory ---
function mmStart(){
 const pairs=shuffle(gPool()).slice(0,6);const cards=shuffle(pairs.flatMap(p=>[{p,nl:true},{p,nl:false}]));
 gState={cards,open:[],found:new Set(),moves:0,busy:false};mmRender();
}
function mmRender(){
 const g=gU(),s=gState,card=gHead(g.mm,g.moves+": "+s.moves);gBar(s.found.size/6);
 const grid=el("div","g-mem");
 s.cards.forEach((c,i)=>{const open=s.open.includes(i)||s.found.has(c.p.id);const b=el("button","g-mc"+(open?" open":"")+(s.found.has(c.p.id)?" found":""));b.type="button";
  if(open){const t=el("span","",c.nl?shown(c.p):meaningFor(c.p));if(c.nl)tgt(t);b.appendChild(t)}else b.appendChild(el("span","g-q","?"));
  b.onclick=()=>{if(s.busy||open)return;s.open.push(i);if(c.nl)say(labelFor(c.p));
   if(s.open.length===2){s.moves++;const [x,y]=s.open.map(k=>s.cards[k]);
    if(x.p.id===y.p.id&&x.nl!==y.nl){s.found.add(x.p.id);s.open=[];if(s.found.size===6)return mmEnd()}
    else{s.busy=true;setTimeout(()=>{s.open=[];s.busy=false;if(gState===s&&view==="games"&&grid.isConnected)mmRender()},900)}}
   mmRender()};
  grid.appendChild(b)});
 card.appendChild(grid);
}
function mmEnd(){
 const s=gState,g=gU();const rec=gSetRecord("mm",s.moves,true);const xp=Math.max(10,40-Math.max(0,s.moves-6)*2);
 mmRender();const card=$("card");card.appendChild(el("p","g-done",g.found+" "+g.moves+": "+s.moves+" · "+(rec?"🏅 ":"")+g.pts(xp)));
 const row=el("div","row");const nx=el("button","btn primary",g.again);nx.type="button";nx.id="nx";nx.onclick=mmStart;row.appendChild(nx);card.appendChild(row);
 gameDone("mm",xp);revealNext();
}

 if(releaseFirstVisit){lsSet("leren_release_seen",RELEASE_VERSION);return}
 // Wait for onboarding and other dialogs rather than replacing an active dialog.
 const busy=[...document.querySelectorAll('[role="dialog"]')].some(p=>p.getClientRects().length>0);
 if(busy||tourRoot){setTimeout(announceRelease,1500);return}
 showReleaseNotes();
}
setTimeout(announceRelease,1600);

async function swVersion(){try{const t=await (await fetch("sw.js?version-check="+Date.now(),{cache:"no-store"})).text();return (t.match(/leren-be-v(\d+)/)||[])[1]||""}catch(e){return ""}}
async function showUpdateBar(){
 if($("updBar"))return;const u=updU(),v=await swVersion();
 if(v===RELEASE_VERSION)return; // This page already contains the current release.
 const bar=el("div","upd-bar");bar.id="updBar";bar.setAttribute("role","status");
 const go=el("button","btn primary",u.go);go.type="button";go.onclick=()=>{lsSet("leren_upd_done",v||"1");location.reload()};
 const x=el("button","upd-x","✕");x.type="button";x.setAttribute("aria-label","✕");x.onclick=()=>bar.remove();
 bar.append(el("span","",u.t+(v?" ("+u.ver+" "+v+")":"")),go,x);document.body.appendChild(bar);
}
(function(){const v=lsGet("leren_upd_done","");if(v){lsSet("leren_upd_done","");setTimeout(()=>toast(updU().done+(v==="1"?"":v)),600)}})();
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  const hadController = !!navigator.serviceWorker.controller; // first install is not an "update"
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (hadController) showUpdateBar(); });
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js", {scope: "./"}).then(reg => {
      // apps stay open in the background for days: look for a new version whenever they come back, and every 30 min
      const check = () => reg.update().catch(() => {});
      document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") check(); });
      setInterval(check, 30 * 60 * 1000);
    }).catch(() => {
      // The app remains usable online even if offline setup is unavailable.
    });
  });
}

let tourIdx=-1,tourRoot=null,tourTimer=0;
function tourT(){return TOUR_UI[uiLang]||TOUR_UI.uk}
function tourRect(step){
 if(!step.at)return null;
 const rs=step.at.map(s=>document.querySelector(s)).filter(e=>e&&e.offsetParent!==null||e&&getComputedStyle(e).position==="fixed").map(e=>e.getBoundingClientRect()).filter(r=>r.width||r.height);
 if(!rs.length)return null;
 const pad=6,vw=innerWidth,vh=innerHeight;
 let l=Math.min(...rs.map(r=>r.left))-pad,t=Math.min(...rs.map(r=>r.top))-pad,r=Math.max(...rs.map(r=>r.right))+pad,b=Math.max(...rs.map(r=>r.bottom))+pad;
 l=Math.max(4,l);t=Math.max(4,t);r=Math.min(vw-4,r);b=Math.min(vh-4,b);
 return {left:l,top:t,width:Math.max(0,r-l),height:Math.max(0,b-t),right:r,bottom:b};
}
function tourPlace(){
 if(!tourRoot)return;
 const step=TOUR_STEPS[tourIdx],spot=tourRoot.querySelector(".tour-spot"),card=tourRoot.querySelector(".tour-card");
 const r=tourRect(step),vw=innerWidth,vh=innerHeight,gap=12;
 const w=Math.min(420,vw-24);card.style.width=w+"px";
 const h=card.offsetHeight;
 if(!r){spot.style.cssText="left:50%;top:50%;width:0;height:0";card.style.left=Math.round((vw-w)/2)+"px";card.style.top=Math.max(12,Math.round((vh-h)/2))+"px";return}
 spot.style.cssText=`left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px`;
 let left=Math.min(Math.max(12,r.left+r.width/2-w/2),vw-w-12),top;
 if(vh-r.bottom>=h+gap+8)top=r.bottom+gap;
 else if(r.top>=h+gap+8)top=r.top-h-gap;
 else top=r.top+r.height/2<vh/2?vh-h-12:12;
 card.style.left=Math.round(left)+"px";card.style.top=Math.round(Math.max(12,top))+"px";
}
function tourShow(i){
 tourIdx=Math.max(0,Math.min(TOUR_STEPS.length-1,i));
 const step=TOUR_STEPS[tourIdx],tx=step[uiLang]||step.uk,u=tourT(),last=tourIdx===TOUR_STEPS.length-1;
 const card=tourRoot.querySelector(".tour-card");card.replaceChildren();
 card.appendChild(el("div","tour-count",(tourIdx+1)+" / "+TOUR_STEPS.length));
 const h=el("h2","",tx[0]);h.id="tourTitle";card.appendChild(h);
 tx.slice(1).forEach(p=>{const e=el("p","");e.innerHTML=p;card.appendChild(e)});
 if(step.actions){const a=el("div","tour-actions");step.actions.forEach(k=>{
  const b=el("button","btn");b.type="button";
  if(k==="pickVoice"){b.textContent=u.pickVoice;b.onclick=()=>{updateHeader();populateVoicePicker();$("voiceDialog").showModal()}}
  else if(k==="sample"){b.textContent=u.sample;b.onclick=()=>say(speechSampleText(),b)}
  else if(k==="auto"){const lab=()=>b.textContent=autoSpeech?u.autoOff:u.autoOn;lab();b.onclick=()=>{autoSpeech=!autoSpeech;lsSet("leren_auto_speech",autoSpeech);updateHeader();lab()}}
  a.appendChild(b)});card.appendChild(a)}
 const dots=el("div","tour-dots");TOUR_STEPS.forEach((_,j)=>dots.appendChild(el("i",j===tourIdx?"on":"")));card.appendChild(dots);
 const row=el("div","tour-row");
 const skip=el("button","tour-skip",u.skip);skip.type="button";skip.onclick=()=>tourEnd();if(last)skip.style.visibility="hidden";
 const back=el("button","btn",u.back);back.type="button";back.disabled=tourIdx===0;back.onclick=()=>tourShow(tourIdx-1);
 const next=el("button","btn primary",last?u.start:u.next);next.type="button";next.onclick=()=>last?tourEnd():tourShow(tourIdx+1);
 row.append(skip,back,next);card.appendChild(row);
 // bring the target into view, then place spotlight and card
 const t=step.at&&document.querySelector(step.at[0]);
 if(t&&getComputedStyle(t).position!=="fixed"&&getComputedStyle(t).position!=="absolute"){const b=t.getBoundingClientRect();if(b.top<70||b.bottom>innerHeight-200)t.scrollIntoView({block:"center",behavior:"smooth"})}
 if(t&&t.id==="themeToggle"||t&&t.id==="helpBtn"||t&&t.closest&&t.closest("header"))window.scrollTo({top:0,behavior:"smooth"});
 tourPlace();clearTimeout(tourTimer);tourTimer=setTimeout(tourPlace,420);
 next.focus({preventScroll:true});
}
function tourKey(e){
 if(!tourRoot||$("voiceDialog")?.open)return;
 if(e.key==="Escape"){e.preventDefault();tourEnd()}
 else if(e.key==="ArrowRight"&&!e.target.closest?.("select"))tourShow(tourIdx+(document.documentElement.dir==="rtl"?-1:1));
 else if(e.key==="ArrowLeft"&&!e.target.closest?.("select"))tourShow(tourIdx+(document.documentElement.dir==="rtl"?1:-1));
}
function startTour(){
 if(tourRoot)return;
 document.querySelectorAll(".sheet:not([hidden])").forEach(x=>closeSheet(x.id));
 if(view!=="lesson")setView("lesson");
 tourRoot=el("div","tour");tourRoot.setAttribute("role","dialog");tourRoot.setAttribute("aria-modal","true");tourRoot.setAttribute("aria-labelledby","tourTitle");
 tourRoot.append(el("div","tour-spot"),el("div","tour-card"));
 document.body.appendChild(tourRoot);
 addEventListener("resize",tourPlace);addEventListener("scroll",tourPlace,{passive:true});document.addEventListener("keydown",tourKey);
 tourShow(0);
}
function tourEnd(){
 if(!tourRoot)return;
 lsSet("leren_tour_done",true);
 removeEventListener("resize",tourPlace);removeEventListener("scroll",tourPlace);document.removeEventListener("keydown",tourKey);
 tourRoot.remove();tourRoot=null;tourIdx=-1;clearTimeout(tourTimer);
 if(typeof afterTourEnd==="function")afterTourEnd();
 $("helpBtn")?.focus({preventScroll:true});
}
$("helpBtn").addEventListener("click",()=>{closeSheet("settingsSheet");setTimeout(startTour,250)});
function updateHelpBtn(){}
if(targetLang!=="nl")setTimeout(firstRun,600);
