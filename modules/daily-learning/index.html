<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Моє навчання · leren.be</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#1b2938;background:#fff8e8}*{box-sizing:border-box}body{margin:0;padding:18px 14px 80px}.wrap{max-width:760px;margin:auto}header{display:flex;justify-content:space-between;gap:12px;align-items:center}.card{background:white;border:1px solid #eadfc9;border-radius:20px;padding:20px;margin:15px 0;box-shadow:0 5px 16px #5434000d}h1{font-size:clamp(24px,5vw,36px);margin:12px 0}h2{font-size:22px;margin:5px 0 12px}.muted{color:#5e6874}.badge{display:inline-block;background:#fff0b5;padding:5px 11px;border-radius:100px;font-weight:700}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}button,.link{border:1px solid #d6d7d8;background:#fff;border-radius:13px;padding:13px 16px;font:inherit;cursor:pointer;color:inherit;text-align:left;min-height:48px}button:hover,.link:hover{border-color:#ecaa2d}button.primary{background:#171717;color:white;border-color:#171717;font-weight:700;text-align:center}button:disabled{opacity:.5;cursor:default}.selected{border:2px solid #d78a00;background:#fff4d7}.steps{display:flex;gap:6px;flex-wrap:wrap}.steps span{background:#f4f5f7;border-radius:8px;padding:6px 9px;font-size:13px}.big{font-size:clamp(24px,6vw,38px);font-weight:800}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.good{color:#157347}.bad{color:#b72e2e}a{color:#8d5700}#app[aria-busy=true]{opacity:.8}@media(max-width:420px){.card{padding:15px}.row button{flex:1}header{align-items:flex-start}}
</style></head><body><div class="wrap"><header><a href="../../index.html">← leren.be</a><span class="badge">🇧🇪 A1 · A1.1 + A1.2</span></header><main id="app" aria-live="polite"></main></div><script src="../../course-curriculum.js"></script><script>
(()=>{'use strict';const app=document.getElementById('app');const KEY='leren_daily_beta_v1';const LANG_KEY='leren_daily_language_v1';const LANGS={uk:{name:"🇺🇦 Українська",welcome:"Оберіть мову пояснень",hint:"Мову можна змінити будь-коли. Нідерландська залишається мовою навчання.",continue:"Продовжити",know:"Що ти вже знаєш?",zero:"🌱 Починаю з нуля",some:"🙂 Трохи знаю",talk:"🗣️ Уже спілкуюся",change:"🌐 Змінити мову",note:"Тестова версія: переклади самих уроків наразі українською."},en:{name:"🇬🇧 English",welcome:"Choose your explanation language",hint:"You can change this later. You will learn Dutch.",continue:"Continue",know:"How much Dutch do you know?",zero:"🌱 Complete beginner",some:"🙂 I know a little",talk:"🗣️ I can already speak",change:"🌐 Change language",note:"Beta: lesson translations are currently available in Ukrainian only."},fr:{name:"🇫🇷 Français",welcome:"Choisissez votre langue d’explication",hint:"Vous pourrez la changer plus tard. Vous apprendrez le néerlandais.",continue:"Continuer",know:"Quel est votre niveau de néerlandais ?",zero:"🌱 Je débute",some:"🙂 Je connais quelques mots",talk:"🗣️ Je parle déjà un peu",change:"🌐 Changer de langue",note:"Bêta : les traductions des leçons sont actuellement en ukrainien."},ar:{name:"🇸🇦 العربية",welcome:"اختر لغة الشرح",hint:"يمكنك تغييرها لاحقًا. ستتعلم اللغة الهولندية.",continue:"متابعة",know:"ما مستوى معرفتك بالهولندية؟",zero:"🌱 أبدأ من الصفر",some:"🙂 أعرف بعض الكلمات",talk:"🗣️ أستطيع التحدث قليلًا",change:"🌐 تغيير اللغة",note:"نسخة تجريبية: ترجمة الدروس متاحة حاليًا بالأوكرانية فقط."}};let lang=localStorage.getItem(LANG_KEY)||null;const tr=k=>LANGS[lang||'uk'][k];const langPick=()=>{let detected=(navigator.languages||[navigator.language]).map(x=>x.slice(0,2)).find(x=>LANGS[x])||'en';let choice=lang||detected;set(`<div class="card"><h1>🌍 Choose your language · Оберіть мову</h1><p>🇧🇪 leren.be</p><div id="languageChoices" class="grid"></div><p id="languageHint" class="muted"></p><div id="languageNext"></div></div>`);const opts=document.getElementById('languageChoices');const draw=()=>{opts.innerHTML='';Object.keys(LANGS).forEach(k=>opts.append(btn(LANGS[k].name,()=>{choice=k;draw()},choice===k?'selected':'')));document.getElementById('languageHint').textContent=LANGS[choice].hint;let next=document.getElementById('languageNext');next.innerHTML='';next.append(btn(LANGS[choice].continue+' →',()=>{lang=choice;localStorage.setItem(LANG_KEY,lang);document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';if(state.start)home();else intro()},'primary'))};draw()};const chapters=globalThis.LerenCurriculum?.chapters||[];let state;try{state=JSON.parse(localStorage.getItem(KEY))||{}}catch{state={}};state.completed=state.completed||{};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}};let current=0,step=0,answers=0;state.review=state.review||{};const btn=(txt,fn,cls='')=>{let b=document.createElement('button');b.textContent=txt;b.className=cls;b.addEventListener('click',fn);return b};const set=(s)=>{app.innerHTML=s};const line=(nl,uk)=>({nl,uk});
const seed=[
[line('Hallo!','Привіт!'),line('Dank u.','Дякую.'),line('Hoe heet je?','Як тебе звати?'),line('Ik heet Anna.','Мене звати Анна.'),line('Tot ziens!','До побачення!')],
[line('Dit is mijn familie.','Це моя сім’я.'),line('Mijn moeder','Моя мама'),line('Mijn vader','Мій тато'),line('Dit is mijn vriend.','Це мій друг.'),line('Wie is dat?','Хто це?')],
[line('Eén','Один'),line('Twee','Два'),line('Drie','Три'),line('Hoeveel kost het?','Скільки це коштує?'),line('Tien euro','Десять євро')],
[line('Hoe laat is het?','Котра година?'),line('Het is één uur.','Перша година.'),line('De bus','Автобус'),line('De trein','Поїзд'),line('Waar is het station?','Де вокзал?')],
[line('Vandaag','Сьогодні'),line('Morgen','Завтра'),line('Mijn verjaardag','Мій день народження'),line('Januari','Січень'),line('Ik ben dertig jaar.','Мені тридцять років.')],
[line('Open','Відчинено'),line('Gesloten','Зачинено'),line('Maandag','Понеділок'),line('Zaterdag','Субота'),line('Wanneer is de winkel open?','Коли магазин відчинений?')],
[line('Mijn naam','Моє ім’я'),line('Mijn adres','Моя адреса'),line('Mijn telefoonnummer','Мій номер телефону'),line('Alstublieft','Будь ласка'),line('Ik heb een afspraak.','У мене запис на прийом.')],
[line('Ik sta op.','Я встаю.'),line('Ik werk.','Я працюю.'),line('Ik eet.','Я їм.'),line('Ik slaap.','Я сплю.'),line('Elke dag','Щодня')],
[line('Ga je mee?','Підеш зі мною?'),line('Ja, graag.','Так, із задоволенням.'),line('Sorry','Вибач'),line('Ik kan niet.','Я не можу.'),line('Tot morgen!','До завтра!')],
[line('De dokter','Лікар'),line('Ik heb pijn.','У мене болить.'),line('Mijn hoofd','Моя голова'),line('Ik ben ziek.','Я хворію.'),line('Ik wil een afspraak maken.','Я хочу записатися на прийом.')],
[line('Water','Вода'),line('Brood','Хліб'),line('Groente','Овочі'),line('Fruit','Фрукти'),line('Ik eet gezond.','Я харчуюся здорово.')],
[line('De winkel','Магазин'),line('De melk','Молоко'),line('Het brood','Хліб'),line('Ik wil dit kopen.','Я хочу це купити.'),line('Hoeveel kost dit?','Скільки це коштує?')]
];
function speak(t){if(!('speechSynthesis'in window)){alert('Озвучення недоступне на цьому пристрої');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);let vs=speechSynthesis.getVoices();let v=vs.find(v=>v.lang.toLowerCase()==='nl-be')||vs.find(v=>v.lang.toLowerCase()==='nl-nl')||vs.find(v=>v.lang.toLowerCase().startsWith('nl'));u.lang=v?.lang||'nl-BE';if(v)u.voice=v;u.rate=.85;speechSynthesis.speak(u)}
function intro(){set(`<div class="card"><h1>👋 Welkom bij leren.be!</h1><p>${esc(tr("hint"))}</p><h2>${esc(tr("know"))}</h2><div class="grid" id="choices"></div><p class="muted">${esc(tr("note"))}</p><div id="changeLang"></div></div>`);let c=document.getElementById("choices");[["zero",tr("zero")],["some",tr("some")],["talk",tr("talk")]].forEach(([id,t])=>c.append(btn(t,()=>{state.start=id;save();home()})));document.getElementById("changeLang").append(btn(tr("change"),langPick))}
function dueReviews(){const now=Date.now();return Object.entries(state.review).filter(([k,v])=>v.due<=now).map(([k,v])=>({key:k,...v}))}
function reviewScreen(){const due=dueReviews();if(!due.length){home();return}let i=0,correct=0;const show=()=>{if(i>=due.length){set(`<div class="card"><h1>🎉 Повторення завершено</h1><p>Правильних відповідей: ${correct}/${due.length}</p><div id="finishReview"></div></div>`);document.getElementById('finishReview').append(btn('До навчання →',home,'primary'));return}const item=due[i];set(`<div class="card"><span class="badge">🧠 Повторення ${i+1}/${due.length}</span><h1>${esc(item.nl)}</h1><p>Спробуй згадати значення самостійно. Не поспішай.</p><div id="reviewActions"></div></div>`);const a=document.getElementById('reviewActions');a.append(btn('🔊 Прослухати',()=>speak(item.nl)));a.append(btn('Показати переклад',()=>{a.innerHTML=`<p class="big">${esc(item.uk)}</p><p>Ти згадав правильний переклад?</p>`;a.append(btn('🙂 Так, згадав',()=>finish(true),'primary'));a.append(btn('🔄 Потрібно повторити',()=>finish(false)))}));function finish(ok){if(ok)correct++;const old=state.review[item.key];const interval=ok?Math.min((old.interval||0)*2||1,14):1;state.review[item.key]={...old,interval,due:Date.now()+interval*86400000};save();i++;show()}};show()}
function home(){const done=Object.keys(state.completed).length;set(`<div class="card"><span class="badge">Твій маршрут · A1</span><h1>🎯 Моє навчання</h1><p>Ми покажемо, що робити, пояснимо кожне слово українською і завтра нагадаємо повторити вивчене. Один короткий урок за раз: <b>3 хв слова · 2 хв слухання · 3 хв тест · 3 хв діалог · 1 хв повторення</b>. Час орієнтовний.</p><p class="muted">Завершено тем: ${done} / ${chapters.length}</p><div class="row" id="mainActions"></div></div><div class="card"><h2>Усі 12 тем A1 — з поясненнями українською</h2><p class="muted">Теми взяті з чинної програми A1.1 та A1.2 твого проєкту. Ця бета показує коротке вступне заняття для кожного розділу.</p><div class="grid" id="topics"></div></div>`);const a=document.getElementById('mainActions');const due=dueReviews().length;if(due){a.append(btn(`🧠 Спочатку повторити (${due})`,reviewScreen,'primary'))}a.append(btn('▶ Продовжити навчання',()=>start(Math.min(chapters.length-1,chapters.findIndex((_,i)=>!state.completed[i])<0?0:chapters.findIndex((_,i)=>!state.completed[i]))),'primary'));a.append(btn('🔄 Змінити початкові знання',intro));a.append(btn(tr('change'),langPick));const list=document.getElementById('topics');chapters.forEach((ch,i)=>list.append(btn(`${state.completed[i]?'✅':'📚'} ${i+1}. ${ch[1]} — ${seed[i][0].uk}`,()=>start(i))))}
function start(i){current=i;step=0;answers=0;render()}
function render(){const words=seed[current],title=chapters[current][1];const phases=['📚 Слова','🔊 Слухання','🎮 Тест','💬 Діалог','🧠 Повторення'];set(`<div class="card"><div class="row"><button id="back">← До тем</button><span class="badge">${current+1}/12 · ${esc(title)}</span></div><h1>${phases[step]}</h1><div class="steps">${phases.map((s,i)=>`<span style="${i===step?'background:#ffe19b;font-weight:700':''}">${s}</span>`).join('')}</div><div id="stage" class="card" style="box-shadow:none"></div></div>`);document.getElementById('back').onclick=home;const box=document.getElementById('stage');if(step===0){box.innerHTML='<p>Сьогодні лише п’ять фраз. Натискай 🔊, слухай і повторюй уголос. Український переклад — під кожною фразою. Не потрібно нічого знати заздалегідь.</p>';words.forEach(w=>{const r=document.createElement('div');r.className='row';r.style='padding:8px 0;border-bottom:1px solid #eee';r.innerHTML=`<div style="flex:1"><b>${esc(w.nl)}</b><br><span class="muted">${esc(w.uk)}</span></div>`;r.append(btn('🔊',()=>speak(w.nl)));box.append(r)});box.append(btn('Далі: слухання →',next,'primary'))}if(step===1){let ix=0;const draw=()=>{box.innerHTML=`<p>Послухай фразу та спробуй згадати її значення.</p><div class="big">${ix+1} / 3</div>`;box.append(btn('🔊 Прослухати',()=>speak(words[ix].nl)));let reveal=btn('Показати переклад',()=>{let p=document.createElement('p');p.textContent=words[ix].uk;box.append(p);reveal.disabled=true});box.append(reveal);box.append(btn(ix===2?'Далі: тест →':'Наступна фраза →',()=>{ix++;if(ix===3)next();else draw()},'primary'))};draw()}if(step===2){let q=0,score=0;const ask=()=>{if(q>=3){answers=score;box.innerHTML=`<h2>Тест завершено: ${score}/3</h2><p>Помилки — це підказка, що повторити. Можеш рухатися далі.</p>`;box.append(btn('Далі: діалог →',next,'primary'));return}let correct=words[q].uk;let opts=[correct,...words.filter((_,i)=>i!==q).slice(0,3).map(x=>x.uk)].sort((a,b)=>((a.length+q*7)%11)-((b.length+q*7)%11));box.innerHTML=`<p>Що означає <b>${esc(words[q].nl)}</b>?</p><div class="grid" id="opts"></div><p id="feedback" role="status"></p>`;opts.forEach(o=>document.getElementById('opts').append(btn(o,()=>{const ok=o===correct;if(ok)score++;document.querySelectorAll('#opts button').forEach(b=>b.disabled=true);document.getElementById('feedback').textContent=ok?'✅ Правильно!':'💡 Правильна відповідь: '+correct;box.append(btn('Далі →',()=>{q++;ask()},'primary'))}))) };ask()}if(step===3){box.innerHTML=`<p>Керована розмова для початківців. Це <b>не AI-чат</b>: можна спокійно повторити готові фрази.</p><p><b>Пітер:</b> ${esc(words[0].nl)}</p><p><b>Ти:</b> ${esc(words[1].nl)}</p>`;box.append(btn('🔊 Послухати Пітера',()=>speak(words[0].nl)));box.append(btn('🔊 Повторити свою відповідь',()=>speak(words[1].nl)));box.append(btn('Далі: повторення →',next,'primary'))}if(step===4){box.innerHTML=`<p>Повтори дві фрази, які щойно вивчив:</p><p class="big">${esc(words[2].nl)}</p><p>${esc(words[2].uk)}</p><p class="big">${esc(words[3].nl)}</p><p>${esc(words[3].uk)}</p><p>Результат короткого тесту: <b>${answers}/3</b>.</p>`;box.append(btn('✅ Завершити заняття',()=>{state.completed[current]={at:new Date().toISOString(),score:answers};words.forEach((w,j)=>{const key=current+'-'+j;state.review[key]={nl:w.nl,uk:w.uk,interval:0,due:Date.now()+86400000}});save();home()},'primary'))}}
function next(){step=Math.min(4,step+1);render()}if(!lang)langPick();else{document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';if(!state.start)intro();else home();}
})();</script></body></html>
